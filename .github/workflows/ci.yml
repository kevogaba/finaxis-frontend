name: CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-e2e-secret-ci-e2e-secret-ci-e2e-secret
      # The reserved platform organisation (backend seed). The E2E fake API uses the same id;
      # Playwright also passes it to the dev server explicitly.
      PLATFORM_ORGANISATION_ID: 00000000-0000-0000-0000-000000000000
      KEYCLOAK_ISSUER: http://localhost:8080/realms/finaxis
      KEYCLOAK_CLIENT_ID: finaxis-web-e2e
      KEYCLOAK_CLIENT_SECRET: ci-e2e-client-secret
      AUTH_TRUSTED_ORIGINS: http://localhost:3100
      AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3100/login
      FINAXIS_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both production builds (`.next` and the e2e flavour's `.next-e2e`) reuse Next.js's compiler
      # cache across runs; without it each one starts cold and warns "No build cache found"
      # (https://nextjs.org/docs/app/guides/ci-build-caching).
      - name: Cache Next.js builds
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            .next-e2e/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mts', '**/*.mjs', '!node_modules/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The normal production build must send a bypass session to /login whatever its runtime
      # environment (docs/authentication/security.md).
      - name: Check the production build ignores the e2e bypass
        run: pnpm test:e2e:guard

      - name: Build for end-to-end tests
        run: pnpm build:e2e

      # Not `pnpm test:e2e`, which would build again.
      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
