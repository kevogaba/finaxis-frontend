name: CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-e2e-secret-ci-e2e-secret-ci-e2e-secret
      PLATFORM_ORGANISATION_ID: 8d0cb4e6-521a-4e51-bac0-e4d938c0ee76
      KEYCLOAK_ISSUER: http://localhost:8080/realms/finaxis
      KEYCLOAK_CLIENT_ID: finaxis-web-e2e
      KEYCLOAK_CLIENT_SECRET: ci-e2e-client-secret
      AUTH_TRUSTED_ORIGINS: http://localhost:3100
      AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3100/login
      FINAXIS_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
